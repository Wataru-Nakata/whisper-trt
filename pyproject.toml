[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-trt"
version = "0.1.0"
description = "Fast Whisper inference with TensorRT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10",
    "tensorrt>=10.16",
    "numpy",
    "safetensors",
    "tokenizers",
    "huggingface-hub",
    "soundfile",
    "onnx",
    "onnxscript",
]

[project.scripts]
whisper-trt = "whisper_trt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# The tested combination (and owsm-trt's): the job environment is built from this lock (scripts/build_env_tar.sh)
constraint-dependencies = ["torch==2.14.1", "tensorrt==11.4.0.106"]

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_trt"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
